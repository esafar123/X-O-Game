<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 12px 16px;
  }
  .av { width: 44px; height: 44px; border-radius: var(--r-pill); background: var(--pitch-600); display: grid; place-items: center; font-family: var(--font-headline); font-weight: 800; font-size: 16px; color: var(--fg-1); position: relative; }
  .av .dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); }
  .av .dot.on { background: var(--win); box-shadow: 0 0 6px var(--win); }
  .av .dot.busy { background: var(--warn); }
  .av .dot.off { background: var(--fg-4); }
  .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .nm { font-family: var(--font-headline); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; font-size: 15px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; }
  .stats { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }
  .stats b { color: var(--fg-1); }
  .action {
    background: var(--flood-500); color: var(--pitch-900);
    border: none; border-radius: var(--r-pill);
    padding: 8px 14px;
    font-family: var(--font-headline); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    cursor: pointer;
  }
  .action.ghost { background: transparent; color: var(--fg-2); border: 1px solid var(--border-strong); }
</style>
</head><body>
<div class="row">
  <div class="av">M<span class="dot on"></span></div>
  <div class="info"><span class="nm">Marcus_77</span><span class="meta">Online · Champions League</span></div>
  <div class="stats">12W · 3L</div>
  <button class="action">Challenge</button>
</div>
<div class="row">
  <div class="av" style="color: var(--o-cyan);">A<span class="dot busy"></span></div>
  <div class="info"><span class="nm">Anya.B</span><span class="meta">In match · 2:14</span></div>
  <div class="stats">8W · 4L</div>
  <button class="action ghost">Watch</button>
</div>
<div class="row" style="opacity: 0.6;">
  <div class="av">K<span class="dot off"></span></div>
  <div class="info"><span class="nm">Kai_GG</span><span class="meta">Last seen 2h ago</span></div>
  <div class="stats">15W · 9L</div>
  <button class="action ghost">Invite</button>
</div>
</body></html>
