<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .icon-card {
    aspect-ratio: 1 / 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    color: var(--fg-1);
  }
  .icon-card svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-card .nm { font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head><body>
<div class="grid">
  <div class="icon-card"><svg viewBox="0 0 24 24"><path d="M3 12l2-2 4 4 8-8 4 4"/></svg><span class="nm">Win</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg><span class="nm">Close</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="nm">Clock</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><path d="M5 4h14l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 4z"/><path d="M9 4V2h6v2"/></svg><span class="nm">Trophy</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 22a7 7 0 0114 0"/><circle cx="17" cy="8" r="3"/><path d="M14 22a5 5 0 018-4"/></svg><span class="nm">Friends</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.5-2.5l2-1.5-2-3.5-2.5 1a7 7 0 00-2-1L13 2h-2l-1 2.5a7 7 0 00-2 1l-2.5-1-2 3.5 2 1.5A7 7 0 005 12c0 .9.2 1.7.5 2.5l-2 1.5 2 3.5 2.5-1c.6.4 1.3.7 2 1l1 2.5h2l1-2.5c.7-.3 1.4-.6 2-1l2.5 1 2-3.5-2-1.5c.3-.8.5-1.6.5-2.5z"/></svg><span class="nm">Settings</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="nm">Forward</span></div>

  <div class="icon-card"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span class="nm">Back</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span class="nm">Bolt</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-6 4 2 8-6-5-6 5 2-8-6-4h7z"/></svg><span class="nm">Star</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg><span class="nm">Verified</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg><span class="nm">Locked</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg><span class="nm">Play</span></div>
  <div class="icon-card"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg><span class="nm">Search</span></div>
</div>
</body></html>
