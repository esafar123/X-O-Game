<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .cell {
    border-radius: var(--r-md);
    padding: 14px;
    border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 4px;
    aspect-ratio: 1.1 / 1;
    justify-content: space-between;
  }
  .dot { width: 22px; height: 22px; border-radius: var(--r-pill); border: 1px solid rgba(0,0,0,.2); }
  .nm  { font-family: var(--font-headline); font-weight: 700; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-2); }
  .hx  { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head><body>
<div class="grid">
  <div class="cell"><div class="dot" style="background: var(--win);"></div><div class="nm">Win</div><div class="hx">#4ade80</div></div>
  <div class="cell"><div class="dot" style="background: var(--loss);"></div><div class="nm">Loss</div><div class="hx">#ff2e4d</div></div>
  <div class="cell"><div class="dot" style="background: var(--draw);"></div><div class="nm">Draw</div><div class="hx">#f0ff5a</div></div>
  <div class="cell"><div class="dot" style="background: var(--warn);"></div><div class="nm">Warn</div><div class="hx">#ffb020</div></div>
  <div class="cell"><div class="dot" style="background: var(--info);"></div><div class="nm">Info</div><div class="hx">#00e5ff</div></div>
</div>
</body></html>
