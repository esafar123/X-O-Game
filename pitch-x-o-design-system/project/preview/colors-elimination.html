<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); color: var(--fg-1); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel {
    border-radius: var(--r-lg); padding: 18px 20px;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .panel.eliminated {
    background: var(--eliminate-bg);
    border: 1.5px solid var(--eliminate);
    box-shadow: var(--glow-eliminate);
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .av { width: 44px; height: 44px; border-radius: var(--r-pill); background: var(--pitch-900); display: grid; place-items: center; font-family: var(--font-headline); font-weight: 800; font-size: 16px; }
  .nm { font-family: var(--font-headline); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; font-size: 15px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
  .stamp {
    font-family: var(--font-display); font-size: 22px;
    color: var(--eliminate); letter-spacing: 0.06em; line-height: 1;
  }
  .desc { font-family: var(--font-body); font-size: 12px; color: var(--fg-2); }
</style>
</head><body>
<div class="panel">
  <div class="top">
    <div class="av" style="color: var(--o-cyan); border: 2px solid var(--o-cyan);">O</div>
    <div><div class="nm">Marcus_77</div><div class="meta">Active · Team O</div></div>
  </div>
  <div class="desc">Standard player panel. Cyan border = active, in-match.</div>
</div>
<div class="panel eliminated">
  <div class="top">
    <div class="av" style="color: var(--eliminate); border: 2px solid var(--eliminate);">O</div>
    <div>
      <div class="nm" style="color: var(--eliminate);">Marcus_77</div>
      <div class="meta" style="color: var(--eliminate);">● ELIMINATED · Leaving in 3s</div>
    </div>
  </div>
  <div class="stamp">FULL TIME — OUT</div>
  <div class="desc">Red overlay = the losing player. They are required to leave the match.</div>
</div>
</body></html>
