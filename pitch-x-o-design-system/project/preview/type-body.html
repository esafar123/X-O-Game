<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); color: var(--fg-1); }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 110px; flex-shrink: 0; }
</style>
</head><body>
<div class="stack">
  <div class="row"><span class="tag">h2 / 28</span><h2>Match found</h2></div>
  <div class="row"><span class="tag">h3 / 22</span><h3>Your move</h3></div>
  <div class="row"><span class="tag">body / 16</span><span>Make it count. The clock is on you.</span></div>
  <div class="row"><span class="tag">small / 14</span><span style="font-size: var(--t-small); color: var(--fg-2);">Marcus is online — last seen 2m ago.</span></div>
  <div class="row"><span class="tag">label / 12</span><span class="label">Roster</span></div>
  <div class="row"><span class="tag">mono / 16</span><span class="score" style="font-size: 22px; color: var(--flood-500);">0:08</span></div>
</div>
</body></html>
