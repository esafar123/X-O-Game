<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); color: var(--fg-1); display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 18px; }
  .bar { background: var(--flood-500); border-radius: 2px; height: 18px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 64px; }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style>
</head><body>
<div class="row"><span class="lbl">s-1 · 4</span><div class="bar" style="width: 4px;"></div><span class="val">--s-1 · chip gap</span></div>
<div class="row"><span class="lbl">s-2 · 8</span><div class="bar" style="width: 8px;"></div><span class="val">--s-2 · icon-text</span></div>
<div class="row"><span class="lbl">s-3 · 12</span><div class="bar" style="width: 12px;"></div><span class="val">--s-3 · field padding</span></div>
<div class="row"><span class="lbl">s-4 · 16</span><div class="bar" style="width: 16px;"></div><span class="val">--s-4 · row gap</span></div>
<div class="row"><span class="lbl">s-5 · 20</span><div class="bar" style="width: 20px;"></div><span class="val">--s-5 · screen edge padding</span></div>
<div class="row"><span class="lbl">s-6 · 24</span><div class="bar" style="width: 24px;"></div><span class="val">--s-6 · card padding</span></div>
<div class="row"><span class="lbl">s-8 · 32</span><div class="bar" style="width: 32px;"></div><span class="val">--s-8 · section gap</span></div>
<div class="row"><span class="lbl">s-12 · 48</span><div class="bar" style="width: 48px;"></div><span class="val">--s-12 · screen-section gap</span></div>
</body></html>
