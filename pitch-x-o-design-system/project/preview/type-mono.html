<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); color: var(--fg-1); display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .block { padding: 18px; background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--border); }
  .block .ttl { font-family: var(--font-headline); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--fg-3); margin-bottom: 10px; }
  .specimen { font-family: var(--font-mono); font-size: 28px; letter-spacing: 0.04em; color: var(--flood-500); }
  .digits { font-feature-settings: "tnum" 1; }
  .stat-row { display: flex; gap: 14px; margin-top: 8px; font-family: var(--font-mono); font-size: 14px; color: var(--fg-2); }
  .stat-row b { color: var(--fg-1); }
</style>
</head><body>
<div class="block">
  <div class="ttl">Scoreboard mono</div>
  <div class="specimen digits">0123456789 : - .</div>
  <div class="stat-row">JetBrains Mono · tabular</div>
</div>
<div class="block">
  <div class="ttl">Stats</div>
  <div class="stat-row"><span>W <b>12</b></span><span>L <b>3</b></span><span>D <b>1</b></span><span>WIN% <b>75</b></span></div>
  <div class="stat-row" style="margin-top: 14px;"><span>STREAK <b style="color: var(--flood-500);">5</b></span><span>RANK <b>#214</b></span></div>
</div>
</body></html>
