<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn {
    font-family: var(--font-headline); font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.06em; font-size: 14px;
    padding: 14px 22px; border-radius: var(--r-md);
    border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn.primary { background: var(--flood-500); color: var(--pitch-900); box-shadow: var(--shadow-pop); }
  .btn.secondary { background: transparent; color: var(--fg-1); border: 1.5px solid var(--border-strong); }
  .btn.ghost { background: var(--surface); color: var(--fg-1); }
  .btn.danger { background: var(--eliminate); color: white; }
  .btn:disabled { opacity: 0.4; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; width: 90px; }
</style>
</head><body>
<div class="row"><span class="lbl">Primary</span>
  <button class="btn primary">Kick off →</button>
  <button class="btn primary">Find Match</button>
  <button class="btn primary" disabled>Locked</button>
</div>
<div class="row"><span class="lbl">Secondary</span>
  <button class="btn secondary">Invite Friend</button>
  <button class="btn secondary">Settings</button>
</div>
<div class="row"><span class="lbl">Ghost</span>
  <button class="btn ghost">Cancel</button>
  <button class="btn ghost">Run it back</button>
</div>
<div class="row"><span class="lbl">Danger</span>
  <button class="btn danger">Forfeit</button>
</div>
</body></html>
