<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .box {
    aspect-ratio: 1.1 / 1;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--fg-2); gap: 6px;
  }
  .nm { font-family: var(--font-headline); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-1); }
  .vl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style>
</head><body>
<div class="box" style="border-radius: var(--r-xs);"><span class="nm">XS</span><span class="vl">4px</span></div>
<div class="box" style="border-radius: var(--r-sm);"><span class="nm">SM</span><span class="vl">8px</span></div>
<div class="box" style="border-radius: var(--r-md);"><span class="nm">MD</span><span class="vl">12px</span></div>
<div class="box" style="border-radius: var(--r-lg);"><span class="nm">LG</span><span class="vl">18px</span></div>
<div class="box" style="border-radius: var(--r-xl);"><span class="nm">XL</span><span class="vl">28px</span></div>
</body></html>
