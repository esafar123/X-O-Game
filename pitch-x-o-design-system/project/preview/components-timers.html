<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ring {
    width: 110px; height: 110px;
    position: relative;
    display: grid; place-items: center;
  }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .fill { fill: none; stroke: var(--flood-500); stroke-width: 6; stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(212,255,0,0.6)); }
  .ring .track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 6; }
  .ring .num { font-family: var(--font-display); font-size: 38px; color: var(--flood-500); letter-spacing: 0.04em; }
  .ring.danger .fill { stroke: var(--eliminate); filter: drop-shadow(0 0 6px rgba(255,46,77,0.6)); }
  .ring.danger .num { color: var(--eliminate); }
  .lbl { font-family: var(--font-headline); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--fg-3); }

  /* digital scoreboard variant */
  .digital {
    background: var(--pitch-900);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 14px 22px;
    font-family: var(--font-mono); font-size: 38px; color: var(--flood-500);
    letter-spacing: 0.08em;
    text-shadow: 0 0 12px rgba(212,255,0,0.5);
  }

  /* shrinking bar */
  .bar-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: var(--r-pill); overflow: hidden; }
  .bar-wrap .fill { height: 100%; background: var(--flood-500); width: 60%; box-shadow: 0 0 12px rgba(212,255,0,0.6); }
</style>
</head><body>
<div class="timer-wrap">
  <div class="ring">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="45"/>
      <circle class="fill" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="85"/>
    </svg>
    <div class="num">8</div>
  </div>
  <span class="lbl">Ring · running</span>
</div>
<div class="timer-wrap">
  <div class="ring danger">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="45"/>
      <circle class="fill" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="240"/>
    </svg>
    <div class="num">2</div>
  </div>
  <span class="lbl">Ring · last seconds</span>
</div>
<div class="timer-wrap" style="justify-content: center;">
  <div class="digital">00:08</div>
  <span class="lbl">Scoreboard variant</span>
  <div class="bar-wrap" style="margin-top: 8px; width: 140px;"><div class="fill"></div></div>
  <span class="lbl">Bar variant</span>
</div>
</body></html>
