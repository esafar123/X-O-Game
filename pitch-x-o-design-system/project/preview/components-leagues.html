<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .league {
    border-radius: var(--r-lg);
    padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    position: relative;
  }
  .league.unlocked { border-color: rgba(212,255,0,0.4); box-shadow: 0 0 24px rgba(212,255,0,0.10); }
  .league.locked { opacity: 0.55; }
  .top { display: flex; align-items: baseline; justify-content: space-between; }
  .name { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.04em; line-height: 1; }
  .num { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; }
  .desc { font-family: var(--font-body); font-size: 13px; color: var(--fg-2); }
  .bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: var(--r-pill); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--flood-500); }
  .stars { display: flex; gap: 4px; }
  .star { width: 14px; height: 14px; }
  .star.on { fill: var(--flood-500); filter: drop-shadow(0 0 4px rgba(212,255,0,0.5)); }
  .star.off { fill: rgba(255,255,255,0.15); }
  .lock { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; }
</style>
</head><body>
<div class="league unlocked">
  <div class="top"><span class="num">League 01</span>
    <div class="stars">
      <svg class="star on" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 16.5,14 18,21 12,17 6,21 7.5,14 2,9.5 9,9"/></svg>
      <svg class="star on" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 16.5,14 18,21 12,17 6,21 7.5,14 2,9.5 9,9"/></svg>
      <svg class="star on" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 16.5,14 18,21 12,17 6,21 7.5,14 2,9.5 9,9"/></svg>
    </div>
  </div>
  <div class="name" style="color: var(--flood-500);">Sunday League</div>
  <div class="desc">Casual. 15s clock. Easy AI.</div>
  <div class="bar"><div class="fill" style="width: 100%;"></div></div>
</div>
<div class="league unlocked">
  <div class="top"><span class="num">League 02</span>
    <div class="stars">
      <svg class="star on" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 16.5,14 18,21 12,17 6,21 7.5,14 2,9.5 9,9"/></svg>
      <svg class="star on" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 16.5,14 18,21 12,17 6,21 7.5,14 2,9.5 9,9"/></svg>
      <svg class="star off" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9.5 16.5,14 18,21 12,17 6,21 7.5,14 2,9.5 9,9"/></svg>
    </div>
  </div>
  <div class="name">Pro Pitch</div>
  <div class="desc">10s clock. Smart AI.</div>
  <div class="bar"><div class="fill" style="width: 60%;"></div></div>
</div>
<div class="league locked">
  <div class="top"><span class="num">League 03</span><span class="lock">🔒 Locked</span></div>
  <div class="name">All-Star</div>
  <div class="desc">7s clock. Aggressive AI.</div>
  <div class="bar"><div class="fill" style="width: 0%;"></div></div>
</div>
<div class="league locked">
  <div class="top"><span class="num">League 04</span><span class="lock">🔒 Locked</span></div>
  <div class="name">Champions</div>
  <div class="desc">5s clock. Ruthless AI.</div>
  <div class="bar"><div class="fill" style="width: 0%;"></div></div>
</div>
</body></html>
