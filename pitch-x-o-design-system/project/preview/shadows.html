<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px; background: var(--bg); display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .card {
    aspect-ratio: 1.3 / 1;
    background: var(--surface);
    border-radius: var(--r-lg);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
  }
  .nm { font-family: var(--font-headline); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--fg-2); }
  .vl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: center; max-width: 180px; }
  .pop {
    background: var(--flood-500); color: var(--pitch-900);
    border-radius: var(--r-md);
    padding: 12px 18px;
    font-family: var(--font-headline); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  }
</style>
</head><body>
<div class="card" style="box-shadow: var(--shadow-1);"><span class="nm">shadow-1</span><span class="vl">subtle press · 0 1px 2px</span></div>
<div class="card" style="box-shadow: var(--shadow-2);"><span class="nm">shadow-2</span><span class="vl">card · 0 6px 18px + inset</span></div>
<div class="card" style="box-shadow: var(--shadow-3);"><span class="nm">shadow-3</span><span class="vl">sheet/modal · 0 18px 42px</span></div>
<div class="card" style="background: transparent; border: none;"><div class="pop" style="box-shadow: var(--shadow-pop);">PRIMARY CTA</div><span class="vl" style="margin-top: 10px;">shadow-pop · athletic 8px hard offset</span></div>
<div class="card" style="box-shadow: var(--glow-flood);"><span class="nm" style="color: var(--flood-500);">glow-flood</span><span class="vl">CTA · focus · key numbers</span></div>
<div class="card" style="box-shadow: var(--glow-x);"><span class="nm" style="color: var(--x-chalk);">glow-x · glow-o</span><span class="vl">team chrome · active mark</span></div>
</body></html>
