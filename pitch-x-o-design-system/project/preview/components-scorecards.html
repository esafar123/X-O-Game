<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .scorecard {
    background: var(--surface);
    border-radius: var(--r-lg);
    border: 1px solid var(--border);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .scorecard.active { box-shadow: var(--glow-x); border-color: rgba(255,46,77,0.4); }
  .scorecard.active.o { box-shadow: var(--glow-o); border-color: rgba(0,229,255,0.4); }
  .top { display: flex; align-items: center; gap: 10px; }
  .av { width: 36px; height: 36px; border-radius: var(--r-pill); background: var(--pitch-600); display: grid; place-items: center; font-family: var(--font-headline); font-weight: 800; font-size: 14px; }
  .av.x { color: var(--x-chalk); }
  .av.o { color: var(--o-cyan); }
  .who { font-family: var(--font-headline); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 13px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; }
  .big { font-family: var(--font-display); font-size: 56px; line-height: 1; letter-spacing: 0.04em; }
  .big.x { color: var(--x-chalk); }
  .big.o { color: var(--o-cyan); }
  .turn { font-family: var(--font-mono); font-size: 11px; color: var(--flood-500); text-transform: uppercase; letter-spacing: 0.12em; }
</style>
</head><body>
<div class="scorecard active">
  <div class="top">
    <div class="av x">X</div>
    <div><div class="who">You</div><div class="meta">Team X · Home</div></div>
  </div>
  <div class="big x">2</div>
  <div class="turn">● Your move</div>
</div>
<div class="scorecard">
  <div class="top">
    <div class="av o">O</div>
    <div><div class="who">Marcus_77</div><div class="meta">Team O · Away</div></div>
  </div>
  <div class="big o">1</div>
  <div class="meta">Waiting…</div>
</div>
</body></html>
