<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); color: var(--fg-1); }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 110px; flex-shrink: 0; }
</style>
</head><body>
<div class="stack">
  <div class="row"><span class="tag">display-1 / 88</span><span class="display-1">PITCH XO</span></div>
  <div class="row"><span class="tag">display-2 / 64</span><span class="display-2">FULL TIME</span></div>
  <div class="row"><span class="tag">h1 / 40</span><h1>Sunday League</h1></div>
</div>
</body></html>
