<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field .lbl { font-family: var(--font-headline); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; color: var(--fg-3); }
  .input {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--r-md);
    color: var(--fg-1);
    padding: 14px 16px;
    font-family: var(--font-body); font-size: 16px;
  }
  .input::placeholder { color: var(--fg-4); }
  .input.focus { border-color: var(--flood-500); box-shadow: 0 0 0 3px rgba(212,255,0,0.2); outline: none; }
  .input.error { border-color: var(--eliminate); box-shadow: 0 0 0 3px rgba(255,46,77,0.2); }
  .helper { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
  .helper.err { color: var(--eliminate); }
</style>
</head><body>
<div class="field">
  <span class="lbl">Username</span>
  <input class="input" value="MARCUS_77">
</div>
<div class="field">
  <span class="lbl">Friend code</span>
  <input class="input focus" placeholder="ENTER 6-DIGIT CODE">
  <span class="helper">Focused state · floodlight ring</span>
</div>
<div class="field">
  <span class="lbl">Email</span>
  <input class="input error" value="marcus@">
  <span class="helper err">Looks incomplete. Try again.</span>
</div>
</body></html>
