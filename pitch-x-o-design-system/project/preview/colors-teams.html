<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg); display: flex; flex-direction: column; gap: 14px; }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .team {
    border-radius: var(--r-lg);
    padding: 18px 20px;
    border: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    background: var(--surface);
  }
  .puck {
    width: 56px; height: 56px; border-radius: var(--r-pill);
    display: grid; place-items: center;
    background: var(--pitch-900);
  }
  .puck.x { box-shadow: var(--glow-x); }
  .puck.o { box-shadow: var(--glow-o); }
  .meta { display: flex; flex-direction: column; gap: 2px; }
  .lbl { font-family: var(--font-headline); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; color: var(--fg-3); }
  .val { font-family: var(--font-display); font-size: 28px; line-height: 1; letter-spacing: 0.04em; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .note {
    border: 1px dashed var(--eliminate);
    background: var(--eliminate-bg);
    border-radius: var(--r-md);
    padding: 12px 14px;
    font-family: var(--font-body); font-size: 12px; color: var(--fg-2);
  }
  .note b { color: var(--eliminate); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-headline); font-weight: 800; }
</style>
</head><body>
<div class="row">
  <div class="team">
    <div class="puck x">
      <svg width="34" height="34" viewBox="0 0 100 100" fill="none"><path d="M22 22 L78 78 M78 22 L22 78" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/></svg>
    </div>
    <div class="meta">
      <span class="lbl">Team X — Home</span>
      <span class="val" style="color: var(--chalk-100);">CHALK</span>
      <span class="hex">--x-chalk · #ffffff</span>
    </div>
  </div>
  <div class="team">
    <div class="puck o">
      <svg width="34" height="34" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="28" stroke="#00e5ff" stroke-width="11"/></svg>
    </div>
    <div class="meta">
      <span class="lbl">Team O — Away</span>
      <span class="val" style="color: var(--o-cyan);">#00E5FF</span>
      <span class="hex">--o-cyan</span>
    </div>
  </div>
</div>
<div class="note"><b>Note —</b> Neither team is red. Red is reserved for the player who has just lost and must leave the match.</div>
</body></html>
