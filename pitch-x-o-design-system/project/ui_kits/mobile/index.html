<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pitch X&O — Mobile UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { min-height: 100vh; }
  body {
    margin: 0; padding: 32px 24px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(212,255,0,0.05), transparent 60%),
      var(--pitch-900);
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .header { text-align: center; max-width: 480px; }
  .header h1 {
    font-family: var(--font-display);
    font-size: 56px; letter-spacing: 0.04em;
    color: var(--fg-1); margin-bottom: 6px; line-height: 1;
  }
  .header h1 .accent { color: var(--flood-500); }
  .header p {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--fg-3);
    text-transform: uppercase; letter-spacing: 0.18em;
    margin: 0;
  }
  .nav {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    max-width: 560px; margin-top: 8px;
  }
  .nav button {
    background: var(--surface); color: var(--fg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 8px 14px;
    font-family: var(--font-headline); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px;
    cursor: pointer;
  }
  .nav button.active {
    background: var(--flood-500); color: var(--pitch-900);
    border: none;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>PITCH <span class="accent">XO</span></h1>
    <p>Mobile UI Kit · Click-through prototype</p>
  </div>
  <div class="nav" id="nav"></div>
  <div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="PitchUI.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>

<script type="text/babel">
  const { useState, useMemo } = React;

  const FLOW = ["splash", "home", "friends", "matchmaking", "levels", "board", "gameover", "leaderboard", "settings"];
  const LBL  = {
    splash: "Splash", home: "Home", friends: "Friends", matchmaking: "Matchmaking",
    levels: "Leagues", board: "Board", gameover: "Game over",
    leaderboard: "Leaderboard", settings: "Settings",
  };

  function App() {
    const [screen, setScreen] = useState("splash");
    const [opponent, setOpponent] = useState(null);
    const [result,   setResult]   = useState({ who: "x", line: [0,4,8] });
    const go = (s) => setScreen(s);
    const challenge = (f) => { setOpponent(f); setScreen("matchmaking"); };
    const finish = (r) => { setResult(r); setScreen("gameover"); };

    let body;
    switch (screen) {
      case "splash":      body = <SplashScreen go={go}/>; break;
      case "home":        body = <HomeScreen go={go}/>; break;
      case "friends":     body = <FriendsScreen go={go} challenge={challenge}/>; break;
      case "matchmaking": body = <MatchmakingScreen go={go} opponent={opponent}/>; break;
      case "levels":      body = <LevelsScreen go={go}/>; break;
      case "board":       body = <BoardScreen go={go} opponent={opponent} finish={finish}/>; break;
      case "gameover":    body = <GameOverScreen go={go} result={result} opponent={opponent}/>; break;
      case "leaderboard": body = <LeaderboardScreen go={go}/>; break;
      case "settings":    body = <SettingsScreen go={go}/>; break;
      default:            body = <HomeScreen go={go}/>;
    }

    // Render nav buttons via portal-ish approach:
    React.useEffect(() => {
      const n = document.getElementById("nav");
      n.innerHTML = "";
      FLOW.forEach(s => {
        const b = document.createElement("button");
        b.textContent = LBL[s];
        if (s === screen) b.className = "active";
        b.onclick = () => setScreen(s);
        n.appendChild(b);
      });
    }, [screen]);

    return (
      <IOSDevice dark width={390} height={780}>
        <div style={{ paddingTop: 54, height: "100%", boxSizing: "border-box", background: "var(--pitch-800)" }}>
          {body}
        </div>
      </IOSDevice>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
